<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion des interrupteurs</title>
<style>
*{box-sizing:border-box;margin:0}
body{font:13px Segoe UI,system-ui,sans-serif;background:#e2e8f0;color:#1e293b;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#top{display:flex;gap:8px;align-items:center;padding:6px 8px;background:#1e293b;color:#f1f5f9}
#msg{background:#fef3c7;color:#92400e;padding:8px 12px}
#app{flex:1;min-height:0}
</style>
</head>
<body>
<div id="top"><b>🔘 Gestion des interrupteurs</b></div>
<div id="msg" hidden></div>
<div id="app"></div>
<script src="studio-api.js"></script>
<script src="studio-chars.js"></script>
<script src="studio-events.js"></script>
<script src="studio-lists.js"></script>
<script>
const msg=x=>{const m=document.getElementById("msg");m.hidden=!x;m.textContent=x||""};
let ip=null,again=false;
function init(){if(ip){again=true;return ip}ip=init0().finally(()=>{ip=null;if(again){again=false;init()}});return ip}
async function init0(){msg("");try{await Studio.ensureProject();await Lists.mount({el:document.getElementById("app"),doc:"interrupteurs",kind:"sw",noun:"Interrupteur",idMode:"int",
 hint:"Un interrupteur est activé ou désactivé. Les events s'en servent pour se souvenir de ce qui s'est passé (porte ouverte, PNJ déjà parlé…).",
 cols:[{k:"name",l:"Nom",ph:"Ex : Porte du château ouverte"},{k:"group",l:"Groupe",w:"150px",ph:"Ex : Quête 1"},{k:"initial",l:"Activé au départ",t:"chk",w:"110px"},{k:"note",l:"Note",ph:"Remarque libre"}],
 seed:()=>Array.from({length:10},(_,i)=>i+1)})}catch(e){msg(e.message)}}
Studio.onProject(init);init();
</script>
</body>
</html>
